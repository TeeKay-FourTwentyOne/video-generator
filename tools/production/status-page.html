<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600&family=Libre+Franklin:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column; each scene opens with its era as a display numeral; anchors in a thumbnail strip. */
:root {
  --bg: #ecebe7;
  --panel: #f7f6f3;
  --fg: #1c1b22;
  --fg-2: #57555f;
  --line: #cfccc5;
  --accent: #8a5a0d;
  --velvet: #7a2a3a;
  --chip-muted-bg: #e1dfd9; --chip-muted-fg: #57555f;
  --chip-active-bg: #dce4f0; --chip-active-fg: #28466f;
  --chip-attention-bg: #f5e3bd; --chip-attention-fg: #6f4600;
  --chip-good-bg: #d7e9d7; --chip-good-fg: #1f5629;
  --chip-bad-bg: #f0d4d4; --chip-bad-fg: #862323;
  --font-display: 'Bodoni Moda', 'Bodoni 72', Didot, Georgia, serif;
  --font-body: 'Libre Franklin', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --font-mono: 'IBM Plex Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15141a; --panel: #1e1d25; --fg: #ecebe7; --fg-2: #aaa8b1; --line: #37363f;
    --accent: #e0a93b; --velvet: #c86078;
    --chip-muted-bg: #2b2a32; --chip-muted-fg: #b4b2ba;
    --chip-active-bg: #243650; --chip-active-fg: #b9cdf0;
    --chip-attention-bg: #4a3a12; --chip-attention-fg: #f2d38a;
    --chip-good-bg: #1f3a24; --chip-good-fg: #b5e0bb;
    --chip-bad-bg: #4a2222; --chip-bad-fg: #f0b4b4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15141a; --panel: #1e1d25; --fg: #ecebe7; --fg-2: #aaa8b1; --line: #37363f;
  --accent: #e0a93b; --velvet: #c86078;
  --chip-muted-bg: #2b2a32; --chip-muted-fg: #b4b2ba;
  --chip-active-bg: #243650; --chip-active-fg: #b9cdf0;
  --chip-attention-bg: #4a3a12; --chip-attention-fg: #f2d38a;
  --chip-good-bg: #1f3a24; --chip-good-fg: #b5e0bb;
  --chip-bad-bg: #4a2222; --chip-bad-fg: #f0b4b4;
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
.wrap { max-width: 760px; margin: 0 auto; }
a { color: var(--accent); }
a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2 { font-family: var(--font-display); font-weight: 600; text-wrap: balance; margin: 0; }
p { margin: 0; }
code { font-family: var(--font-mono); font-size: 0.85em; }
.masthead { padding-block: 40px 20px; border-bottom: 3px double var(--line); display: grid; gap: 8px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-2); }
.masthead h1 { font-size: clamp(40px, 8vw, 64px); line-height: 1.02; letter-spacing: -0.01em; }
.format { color: var(--fg-2); }
.stateline { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-top: 6px; font-family: var(--font-mono); font-size: 13px; }
.phase { color: var(--accent); text-transform: uppercase; letter-spacing: 0.1em; }
.phase::before { content: 'Phase · '; color: var(--fg-2); }
.updated { color: var(--fg-2); font-variant-numeric: tabular-nums; }
.summary { padding-block: 28px; display: grid; gap: 14px; border-bottom: 1px solid var(--line); }
.logline { font-family: var(--font-display); font-size: clamp(20px, 3.2vw, 25px); line-height: 1.3; font-weight: 400; }
.next strong { color: var(--velvet); font-weight: 600; }
.toc { padding-block: 18px; border-bottom: 1px solid var(--line); }
.toc ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 18px; }
.toc a { text-decoration: none; color: var(--fg); font-size: 14px; }
.toc a:hover { color: var(--accent); }
.toc .num { font-family: var(--font-display); font-weight: 600; color: var(--accent); }
.draft { padding-block: 28px; border-bottom: 1px solid var(--line); display: grid; gap: 16px; }
.draft-head { display: grid; gap: 6px; }
.draft h2 { font-size: clamp(24px, 4vw, 32px); line-height: 1.1; }
.draft-meta { font-family: var(--font-mono); font-size: 13px; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.player { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 20px; align-items: start; }
.player video { width: 100%; height: auto; aspect-ratio: 9 / 16; background: #000; border: 1px solid var(--line); display: block; }
.player-pending { color: var(--fg-2); font-size: 15px; }
.readout { display: grid; gap: 12px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; position: sticky; top: 12px; }
.tc { font-size: clamp(30px, 6vw, 44px); line-height: 1; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.tc-unit { font-size: 0.5em; color: var(--fg-2); }
.tc-frame { font-size: 15px; color: var(--fg-2); }
.tc-src { font-size: 14px; color: var(--fg-2); min-height: 1.4em; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; }
.controls button, .timeline button { font: 500 13px var(--font-mono); padding: 6px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--fg); cursor: pointer; }
.controls button:hover, .timeline button:hover { border-color: var(--accent); color: var(--accent); }
.controls button:focus-visible, .timeline button:focus-visible, .times a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hint { font-family: var(--font-body); font-size: 13px; color: var(--fg-2); max-width: 44ch; }
.timeline-wrap { overflow-x: auto; scrollbar-width: thin; }
.timeline { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.timeline th, .timeline td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
.timeline th { font-weight: 500; color: var(--fg-2); font-size: 12px; }
.timeline td.num, .timeline th.num { text-align: right; }
.timeline .src { color: var(--fg-2); }
.timeline button { padding: 2px 8px; }
.timeline tbody tr { cursor: pointer; }
.timeline tr.now td { color: var(--accent); }
.timeline tr.now button { border-color: var(--accent); color: var(--accent); }
.times { font-family: var(--font-mono); font-size: 12px; display: inline-flex; gap: 8px; font-variant-numeric: tabular-nums; }
.times a { text-decoration: none; border-bottom: 1px dotted var(--accent); }
@media (max-width: 600px) {
  .player { grid-template-columns: 1fr; }
  .player video { width: min(100%, 300px); margin: 0 auto; }
  .readout { position: static; }
}
.scene { padding-block: 36px 28px; border-bottom: 1px solid var(--line); display: grid; gap: 16px; }
.scene-head { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; }
.era { font-family: var(--font-display); font-weight: 400; font-size: clamp(44px, 9vw, 72px); line-height: 0.9; color: var(--accent); min-width: 2.4ch; font-variant-numeric: tabular-nums; }
.scene-title { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; min-width: 0; flex: 1 1 240px; }
.scene-title h2 { font-size: clamp(24px, 4vw, 32px); line-height: 1.1; }
.scene-summary { color: var(--fg); max-width: 64ch; }
.strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.strip figure { flex: 0 0 auto; width: 112px; margin: 0; display: grid; gap: 4px; }
.strip img { width: 100%; height: auto; max-width: 100%; display: block; border: 1px solid var(--line); background: var(--panel); }
.strip .box { aspect-ratio: 9 / 16; max-width: 100%; border: 1px dashed var(--line); background: var(--panel); display: grid; place-items: center; color: var(--fg-2); font-family: var(--font-mono); font-size: 11px; }
.strip figcaption { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); }
.beats, .decisions ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.beats li, .decisions li { padding-left: 16px; border-left: 2px solid var(--line); display: grid; gap: 4px; }
.beats li:target, .decisions li:target, .scene:target .scene-head { border-left-color: var(--accent); }
.beat-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.beat-title { font-weight: 500; }
.detail { color: var(--fg-2); font-size: 15px; max-width: 64ch; }
.chip { display: inline-block; font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.03em; padding: 2px 8px; border-radius: 3px; white-space: nowrap; }
.tone-muted { background: var(--chip-muted-bg); color: var(--chip-muted-fg); }
.tone-active { background: var(--chip-active-bg); color: var(--chip-active-fg); }
.tone-attention { background: var(--chip-attention-bg); color: var(--chip-attention-fg); }
.tone-good { background: var(--chip-good-bg); color: var(--chip-good-fg); }
.tone-bad { background: var(--chip-bad-bg); color: var(--chip-bad-fg); }
.decisions, .log, .legend { padding-block: 32px; border-bottom: 1px solid var(--line); display: grid; gap: 16px; }
.decisions h2, .log h2 { font-size: 26px; }
.decisions ol { counter-reset: decision; }
.decisions li { counter-increment: decision; }
.decisions .beat-title::before { content: counter(decision) '. '; font-family: var(--font-display); font-weight: 600; color: var(--accent); }
.log dl, .legend dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; }
.log dt { font-family: var(--font-mono); font-size: 13px; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.log dd, .legend dd { margin: 0; min-width: 0; }
.legend dd { color: var(--fg-2); font-size: 14px; }
.legend summary { cursor: pointer; font-weight: 500; }
.colophon { padding-block: 28px; display: grid; gap: 10px; color: var(--fg-2); font-size: 14px; }
.fine { font-size: 13px; }
@media (max-width: 480px) {
  .log dl, .legend dl { grid-template-columns: 1fr; gap: 2px 0; }
  .log dd, .legend dd { margin-bottom: 8px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>
